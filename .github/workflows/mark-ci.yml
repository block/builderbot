name: Mark CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mark/**"
      - "packages/**"
      - "crates/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/mark-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/mark/**"
      - "packages/**"
      - "crates/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/mark-ci.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Install hermit (manages node, rust, just)
      - uses: cashapp/activate-hermit@e49f5cb4dd64ff0b0b659d1d8df499595451155a # v1

      # Enable pnpm via corepack (node ships with corepack; version comes from packageManager in package.json)
      - run: corepack enable pnpm

      # Cache Cargo dependencies
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          workspaces: apps/mark/src-tauri

      # Install system dependencies for Tauri (Linux)
      - name: Install Tauri dependencies (Linux)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=120 \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # Install dependencies
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          cd apps/mark/src-tauri && cargo fetch

      # Run all checks via the app justfile
      - name: Check all (fmt, lint, typecheck)
        run: just -f apps/mark/justfile ci
