name: Penpal CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/penpal/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "rust-toolchain.toml"
      - ".github/workflows/penpal-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/penpal/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "rust-toolchain.toml"
      - ".github/workflows/penpal-ci.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Install hermit (manages node, rust, just, go)
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1.1.5

      # Cache Cargo dependencies
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/penpal/frontend/src-tauri

      # Install system dependencies for Tauri (Linux)
      - name: Install Tauri dependencies (Linux)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=120 \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # Enable pnpm via corepack (node ships with corepack; version comes from packageManager in package.json)
      - run: corepack enable pnpm

      # Install dependencies
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          cd apps/penpal/frontend/src-tauri && cargo fetch

      # Run all checks via the app justfile
      - name: Check all (fmt, lint, typecheck, test)
        run: just -f apps/penpal/justfile ci
