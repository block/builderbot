name: Staged CI

on:
  pull_request:
    branches: [main]
    paths:
      - "staged/**"
  push:
    branches: [main]
    paths:
      - "staged/**"

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: staged

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install hermit (manages node, rust, just)
      - uses: cashapp/activate-hermit@v1
        with:
          working-directory: staged

      # Cache Cargo dependencies
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: staged/src-tauri

      # Install system dependencies for Tauri (Linux)
      - name: Install Tauri dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # Install dependencies
      # TODO: Re-enable npm install once lockfile is compatible with CI
      # - name: Install dependencies
      #   run: just install
      - name: Install dependencies (Rust only)
        working-directory: staged/src-tauri
        run: cargo fetch

      # Run all checks
      # TODO: Re-enable full check-all once npm lockfile is compatible with CI
      # - name: Check all (fmt, lint, typecheck)
      #   run: just check-all
      - name: Format check (Rust only - all crates)
        run: |
          cd .. && cargo fmt --all --check
          cd staged/src-tauri && cargo fmt --check

      - name: Clippy and check (Rust only)
        working-directory: staged/src-tauri
        run: |
          cargo clippy -- -D warnings
          cargo check
