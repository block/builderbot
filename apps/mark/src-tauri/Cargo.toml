[package]
name = "Mark"
version = "0.3.0"
description = "AI-powered development workspace"
authors = ["baxen"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "Mark"

[lib]
name = "mark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.2", features = [] }
tauri-plugin-log = "2.8.0"

# Git integration
thiserror = "2.0"
anyhow = "1.0"
base64 = "0.22"

# Review storage
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
dirs = "6.0"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-window-state = "2.4.1"
reqwest = { version = "0.13.1", features = ["json"] }
tokio = { version = "1.49.0", features = ["sync", "process", "io-util", "macros", "rt-multi-thread"] }
tauri-plugin-opener = "2"

# Shared crates
git-diff = { path = "../../../crates/git-diff" }

# Actions framework
builderbot-actions = { path = "../../../crates/builderbot-actions" }
acp-client = { path = "../../../crates/acp-client" }
blox-cli = { path = "../../../crates/blox-cli" }

async-trait = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }
tauri-plugin-store = "2.4.2"

# MCP server for project sessions
rmcp = { version = "0.9", features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8" }

# Debug binaries archived — uncomment when needed
# [[bin]]
# name = "debug_diff"
# path = "src/bin/debug_diff.rs"
