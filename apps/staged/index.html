<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/staged-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The app's chrome colours (`--bg-chrome` in app.css and the light
         chrome preferences.svelte.ts derives), so the splash, the status bar
         and a Safari tab match the loaded app rather than flashing black. -->
    <meta name="theme-color" content="#18151d" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default` keeps the home-screen app below the status bar, which iOS
         tints to match the page. With black-translucent and viewport-fit=cover,
         iOS 27 draws the page under the status bar but keeps the layout
         viewport the height below it, so the page ends 62 px above the bottom
         of the screen. iOS reads this tag only when the app is added to the
         Home Screen; apps added while it said black-translucent keep that,
         and src/lib/shared/viewportFit.ts drops cover for them. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover"
    />
    <title>Staged</title>
    <!-- The window starts hidden and is shown by App.svelte after the
         theme is applied, so no inline style hacks are needed here. -->
  </head>
  <body>
    <div id="app"></div>
    <!-- Portal target for dialogs, menus and popovers (see BitsConfig in
         Root.svelte). Keeping it after #app means opening a portal never flips
         #app's :last-child state, which would otherwise restyle the whole app. -->
    <div id="portal-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
