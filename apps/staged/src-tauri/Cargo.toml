[package]
name = "Staged"
version = "0.1.9"
description = "AI-powered development workspace"
authors = ["baxen"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "Staged"

[lib]
name = "staged_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
libc = "0.2"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2.10.0"

# Git integration
thiserror = "2.0"
anyhow = "1.0"
base64 = "0.23"
tempfile = "3"
sha2 = "0.11"

# Review storage
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = { version = "2.6.0", features = ["from-directory"] }
include_dir = "0.7.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
dirs = "7.0"
tauri-plugin-clipboard-manager = "2.4.1"
tauri-plugin-window-state = "2.5.0"
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.53.1", features = ["sync", "process", "io-util", "macros", "rt-multi-thread", "time", "fs"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

# Shared crates
git-diff = { path = "../../../crates/git-diff" }
doctor = { path = "../../../crates/doctor" }

# Actions framework
builderbot-actions = { path = "../../../crates/builderbot-actions" }
acp-client = { path = "../../../crates/acp-client" }
agent-client-protocol = { version = "2.2.0", features = ["unstable"] }
blox-cli = { path = "../../../crates/blox-cli" }

regex = "1"
strip-ansi-escapes = "0.2"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }
tauri-plugin-store = "2.5.0"

# MCP server for project sessions
rmcp = { version = "3.5", features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", features = ["ws", "http2"] }
axum-extra = { version = "0.12", features = ["cookie"] }
tower-http = { version = "0.7", features = ["fs", "cors", "compression-br", "compression-gzip"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rand = "0.10"
hex = "0.4"
subtle = "2.6"
time = "0.3"
pikchr = "0.1.4"

# Pikchr preview MCP tool: render Pikchr source to SVG (same C engine as the
# frontend's pikchr-js) and rasterize to PNG for the note-writing agent.
resvg = "0.48"
usvg = "0.48"
tiny-skia = "0.12"

# Managed Node.js runtime: tarball extraction for runtime installs
tar = "0.4"
flate2 = "1"

# Note image dimensions (note_media::dimensions): header-only pixel size for
# every stored raster format, and the PNG pHYs chunk. Both are already in the
# lock (imagesize via tauri, png via `image`); neither decodes pixel data. No
# crate in the tree reads a JPEG's JFIF/EXIF resolution (zune-jpeg's
# `ImageInfo` density fields are never filled from APP0), so that segment
# walk is in the module itself.
imagesize = "0.15"
png = "0.18"

# PDF attachments: rasterize pages with CoreGraphics (note_media::pdf). All
# three crates are already in the lock via arboard/tray-icon (and `image`'s
# jpeg feature only adds zune-jpeg, which resvg pulls in); the feature lists
# are the minimum for CGPDFDocument + a bitmap CGContext + CFData input, and
# a JPEG encoder for prompt pages whose PNG is over the per-image cap.
[target.'cfg(target_os = "macos")'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "CGAffineTransform",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGDataProvider",
    "CGGeometry",
    "CGImage",
    "CGPDFDocument",
    "CGPDFPage",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "CFCGTypes",
    "CFData",
] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# test-util: `#[tokio::test(start_paused = true)]` for the store-events
# coalescer tests, so the 50ms window is driven by the paused clock instead
# of a real sleep.
tokio = { version = "1.53.1", features = ["test-util"] }
# test: tauri's `MockRuntime`, so window_commands' failure paths can be driven
# without a real event loop. Feature unification enables it only when
# compiling tests; the shipped binary's tauri is unchanged.
tauri = { version = "2.12.1", features = ["test"] }

[features]
# no-block-npm-registry: downloads the managed Node.js runtime from upstream
# nodejs.org instead of Block's Artifactory mirror, and lets npm-backed
# doctor checks and fixes use npm's default public registry instead of
# Artifactory's square-npm proxy.
no-block-npm-registry = []

# no-managed-acp-tools: compiles the managed ACP bridge set empty for
# restricted builds — the startup reconciler installs nothing, doctor fixes
# fall back to the doctor crate's regular commands, and the managed shim dir
# is hidden from PATH prepends so shims another build left in the shared
# ~/.staged/packages tree cannot resolve.
no-managed-acp-tools = []

# Debug binaries archived — uncomment when needed
# [[bin]]
# name = "debug_diff"
# path = "src/bin/debug_diff.rs"

[workspace]
