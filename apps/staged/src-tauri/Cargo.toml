[package]
name = "staged"
version = "0.1.0"
description = "Staged — standalone diff viewer"
authors = ["baxen"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
default-run = "staged"

[lib]
name = "staged_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.10.2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
dirs = "5.0"

# Shared crate for diff computation
git-diff = { path = "../../../crates/git-diff" }
