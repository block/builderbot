[package]
name = "Staged"
version = "0.1.8"
description = "AI-powered development workspace"
authors = ["baxen"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "Staged"

[lib]
name = "staged_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
libc = "0.2"
tauri = { version = "2.10.2", features = [] }
tauri-plugin-log = "2.8.0"

# Git integration
thiserror = "2.0"
anyhow = "1.0"
base64 = "0.22"
tempfile = "3"
sha2 = "0.11"

# Review storage
rusqlite = { version = "0.39", features = ["bundled"] }
rusqlite_migration = { version = "2.5.0", features = ["from-directory"] }
include_dir = "0.7.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
dirs = "6.0"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-window-state = "2.4.1"
reqwest = { version = "0.13.1", features = ["json"] }
tokio = { version = "1.50.0", features = ["sync", "process", "io-util", "macros", "rt-multi-thread", "time"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

# Shared crates
git-diff = { path = "../../../crates/git-diff" }
doctor = { path = "../../../crates/doctor" }

# Actions framework
builderbot-actions = { path = "../../../crates/builderbot-actions" }
acp-client = { path = "../../../crates/acp-client" }
blox-cli = { path = "../../../crates/blox-cli" }

regex = "1"
strip-ansi-escapes = "0.2"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }
tauri-plugin-store = "2.4.2"

# MCP server for project sessions
rmcp = { version = "0.17", features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rand = "0.9"
hex = "0.4"
subtle = "2.6"
time = "0.3"

# Debug binaries archived — uncomment when needed
# [[bin]]
# name = "debug_diff"
# path = "src/bin/debug_diff.rs"

[workspace]
