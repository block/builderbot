[package]
name = "staged"
version = "0.1.0"
description = "Staged — standalone diff viewer"
authors = ["baxen"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
default-run = "staged"

[lib]
name = "staged_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.10.2", features = [] }

# Shared crates (proves the split works)
builderbot-actions = { path = "../../../crates/builderbot-actions" }
acp-client = { path = "../../../crates/acp-client" }
blox-cli = { path = "../../../crates/blox-cli" }
