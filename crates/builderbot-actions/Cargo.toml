[package]
name = "builderbot-actions"
version = "0.1.0"
edition = "2021"
description = "Reusable action execution and detection engine for repo+worktree contexts"

[dependencies]
tokio = { version = "1.49", features = ["process", "sync", "io-util", "rt", "rt-multi-thread", "fs", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
anyhow = "1.0"
async-trait = "0.1"
acp-client = { path = "../acp-client" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
