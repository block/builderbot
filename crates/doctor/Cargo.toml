[package]
name = "doctor"
version = "0.1.0"
edition = "2021"
description = "Health-check system for verifying external tool dependencies"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.0", features = ["rt", "macros"] }
futures = "0.3"
reqwest = { version = "0.13", features = ["blocking", "json"] }
dirs = "6"
