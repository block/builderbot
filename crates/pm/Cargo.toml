[package]
name = "pm"
version = "0.1.0"
edition = "2024"
description = "Project manager for multi-repo workspaces with worktree pooling"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
dirs = "6"
colored = "3"

