skip_lfs: true
output:
  - success
  - failure

pre-commit:
  commands:
    fmt:
      run: just fmt
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    crates-fmt:
      run: cargo fmt --all --check
    crates-lint:
      run: cargo clippy --workspace -- -D warnings
    crates-test:
      run: cargo test --workspace
    staged-ci:
      run: just app staged ci
    differ-ci:
      run: just app differ ci
