skip_lfs: true
output:
  - success
  - failure

pre-commit:
  commands:
    mark-fmt:
      root: "apps/mark/"
      run: just fmt
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    mark-lint:
      root: "apps/mark/"
      run: just lint
    mark-typecheck:
      root: "apps/mark/"
      run: just typecheck
