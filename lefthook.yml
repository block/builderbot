skip_lfs: true
output:
  - success
  - failure

pre-commit:
  commands:
    staged-fmt:
      root: "staged/"
      run: just fmt
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    staged-lint:
      root: "staged/"
      run: just lint
    staged-typecheck:
      root: "staged/"
      run: just typecheck
