<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.FileName}} - Birdseye</title>
    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: #fafafa;
            color: #333;
        }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }

        .layout {
            display: grid;
            grid-template-columns: 220px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            padding: 24px 16px;
            border-right: 1px solid #e8e8e8;
            background: #fff;
        }
        .sidebar-title {
            font-size: 0.7em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            margin-bottom: 12px;
        }
        .sidebar-nav {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-nav li {
            margin-bottom: 4px;
        }
        .sidebar-nav a {
            display: block;
            padding: 4px 8px;
            font-size: 0.85em;
            color: #555;
            border-radius: 4px;
            text-decoration: none;
            line-height: 1.4;
        }
        .sidebar-nav a:hover {
            background: #f0f0f0;
            text-decoration: none;
        }
        .sidebar-nav .level-2 { padding-left: 16px; }
        .sidebar-nav .level-3 { padding-left: 28px; font-size: 0.8em; color: #777; }

        .main {
            padding: 24px 40px;
            max-width: 900px;
        }

        .breadcrumb { margin-bottom: 20px; color: #888; font-size: 0.9em; }
        .breadcrumb a { color: #666; }
        .breadcrumb a:hover { color: #0066cc; }

        .content {
            background: #fff;
            padding: 32px 40px;
            border-radius: 8px;
            border: 1px solid #e8e8e8;
            line-height: 1.7;
        }
        .content h1, .content h2, .content h3, .content h4 { color: #333; font-weight: 600; }
        .content h1 { border-bottom: 1px solid #e8e8e8; padding-bottom: 8px; }
        .content h2 { border-bottom: 1px solid #e8e8e8; padding-bottom: 6px; }
        .content code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
            color: #c7254e;
        }
        .content pre {
            background: #282a36;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
        }
        .content pre code {
            background: none;
            padding: 0;
            color: #f8f8f2;
        }
        .content ul, .content ol { padding-left: 24px; }
        .content li { margin-bottom: 4px; }
        .content blockquote {
            border-left: 3px solid #0066cc;
            margin-left: 0;
            padding-left: 16px;
            color: #666;
        }
        .content table {
            border-collapse: collapse;
            width: 100%;
            margin: 16px 0;
        }
        .content th, .content td {
            border: 1px solid #e8e8e8;
            padding: 8px 12px;
            text-align: left;
        }
        .content th {
            background: #f5f5f5;
        }
        .content hr {
            border: none;
            border-top: 1px solid #e8e8e8;
            margin: 24px 0;
        }
        .content img {
            max-width: 100%;
        }
        .content a {
            color: #0066cc;
        }
        /* Style metadata paragraphs */
        .content > p:first-of-type strong {
            display: inline-block;
            min-width: 100px;
        }
        .content > p:first-of-type {
            background: #f8f9fa;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 0.85em;
            color: #666;
            line-height: 2;
        }
        .content .chroma { background: #282a36; }

        @media (max-width: 800px) {
            .layout {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
            .main {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-title">On this page</div>
            <ul class="sidebar-nav">
                {{range .Headings}}
                <li><a href="#{{.ID}}" class="level-{{.Level}}">{{.Text}}</a></li>
                {{end}}
            </ul>
        </div>

        <div class="main">
            <div class="breadcrumb">
                <a href="/">← All Projects</a>
                / <a href="/project/{{.Project.Name}}">{{.Project.Name}}</a>
                / {{.FileName}}
            </div>

            <div class="content">
                {{.Content}}
            </div>
        </div>
    </div>
</body>
</html>
