<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birdseye</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        h1 { color: #00d4ff; margin-bottom: 8px; }
        a { color: #00d4ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .nav { margin-bottom: 24px; }
        .nav a { margin-right: 16px; }
        .stats { color: #888; margin-bottom: 24px; }
        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .project {
            background: #16213e;
            border-radius: 8px;
            padding: 16px;
            border: 1px solid #0f3460;
            transition: border-color 0.2s;
        }
        .project:hover {
            border-color: #00d4ff;
        }
        .project h2 {
            margin: 0 0 8px 0;
            font-size: 1.1em;
        }
        .project-meta {
            font-size: 0.85em;
            color: #888;
        }
        .branch { color: #7ee787; }
        .dirty { color: #f85149; }
    </style>
</head>
<body>
    <h1>Birdseye</h1>
    <div class="nav">
        <a href="/search">Search</a>
        <a href="/recent">Recent Files</a>
    </div>
    <p class="stats">{{len .Projects}} projects with thoughts/</p>
    <div class="projects">
        {{range .Projects}}
        <div class="project">
            <h2><a href="/project/{{.Name}}">{{.Name}}</a></h2>
            <div class="project-meta">
                {{if .Git}}<span class="branch">{{.Git.Branch}}{{if .Git.Dirty}}<span class="dirty">*</span>{{end}}</span> · {{end}}{{.FileCount}} files
            </div>
        </div>
        {{end}}
    </div>
</body>
</html>
