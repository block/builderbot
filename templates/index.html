<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birdseye</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            color: #eee;
        }
        .layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            min-height: 100vh;
        }
        .main {
            padding: 24px 32px;
            overflow-y: auto;
        }
        .sidebar {
            background: #16213e;
            border-left: 1px solid #0f3460;
            padding: 24px;
            overflow-y: auto;
            max-height: 100vh;
            position: sticky;
            top: 0;
        }
        h1 { color: #00d4ff; margin: 0 0 8px 0; font-size: 1.5em; }
        h2 { color: #00d4ff; margin: 0 0 16px 0; font-size: 1.1em; font-weight: 500; }
        a { color: #00d4ff; text-decoration: none; }
        a:hover { text-decoration: underline; }

        .search-box {
            margin-bottom: 24px;
        }
        .search-box input {
            width: 100%;
            padding: 10px 14px;
            font-size: 1em;
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 6px;
            color: #eee;
        }
        .search-box input:focus {
            outline: none;
            border-color: #00d4ff;
        }
        .search-box input::placeholder { color: #666; }

        .file {
            padding: 12px 16px;
            background: #16213e;
            margin-bottom: 8px;
            border-radius: 6px;
            border: 1px solid #0f3460;
            transition: border-color 0.15s;
        }
        .file:hover { border-color: #00d4ff; }
        .file-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
        }
        .file-name { font-weight: 500; }
        .file-age { color: #888; font-size: 0.85em; }
        .file-path { color: #666; font-size: 0.85em; }

        .project {
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #0f3460;
        }
        .project:last-child { border-bottom: none; }
        .project-name {
            font-weight: 500;
            margin-bottom: 4px;
        }
        .project-meta {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 6px;
        }
        .project-summary {
            font-size: 0.85em;
            color: #aaa;
            line-height: 1.4;
        }
        .branch { color: #7ee787; }
        .dirty { color: #f85149; }

        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
                max-height: none;
                border-left: none;
                border-top: 1px solid #0f3460;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="main">
            <h1>Birdseye</h1>
            <div class="search-box">
                <form action="/search" method="GET">
                    <input type="search" name="q" placeholder="Search all thoughts...">
                </form>
            </div>

            <h2>Recent Files</h2>
            {{range .Files}}
            <div class="file">
                <div class="file-header">
                    <span class="file-name"><a href="/file/{{.Project}}/{{.FilePath}}">{{.FileName}}</a></span>
                    <span class="file-age">{{.Age}}</span>
                </div>
                <div class="file-path">{{.Project}}/{{.FilePath}}</div>
            </div>
            {{end}}
        </div>

        <div class="sidebar">
            <h2>Projects ({{len .Projects}})</h2>
            {{range .Projects}}
            <div class="project">
                <div class="project-name"><a href="/project/{{.Name}}">{{.Name}}</a></div>
                <div class="project-meta">
                    {{if .Git}}<span class="branch">{{.Git.Branch}}{{if .Git.Dirty}}<span class="dirty">*</span>{{end}}</span> · {{end}}{{.FileCount}} files
                </div>
                {{if .Summary}}<div class="project-summary">{{.Summary}}</div>{{end}}
            </div>
            {{end}}
        </div>
    </div>
</body>
</html>
