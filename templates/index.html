<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birdseye</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px;
            background: #fafafa;
            color: #333;
        }
        h1 { color: #333; margin: 0 0 8px 0; font-size: 1.5em; font-weight: 600; }
        h2 { color: #555; margin: 24px 0 16px 0; font-size: 1em; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e0e0e0;
        }
        .nav a {
            margin-left: 20px;
            color: #666;
        }
        .nav a:hover { color: #0066cc; }

        .search-box {
            margin-bottom: 32px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px;
            font-size: 1em;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            color: #333;
        }
        .search-box input:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }
        .search-box input::placeholder { color: #999; }

        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }
        .project {
            background: #fff;
            border-radius: 8px;
            padding: 16px 20px;
            border: 1px solid #e8e8e8;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .project:hover {
            border-color: #ccc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .project-name {
            font-weight: 600;
            font-size: 1.05em;
            margin-bottom: 4px;
        }
        .copy-btn {
            background: none;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.75em;
            color: #666;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s, background-color 0.15s, border-color 0.15s;
        }
        .project:hover .copy-btn {
            opacity: 1;
        }
        .copy-btn:hover {
            background: #f5f5f5;
            border-color: #ccc;
            color: #333;
        }
        .copy-btn.copied {
            opacity: 1;
            background: #dafbe1;
            border-color: #1a7f37;
            color: #1a7f37;
        }
        .project-meta {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 8px;
        }
        .project-summary {
            font-size: 0.9em;
            color: #666;
            line-height: 1.5;
        }
        .branch { color: #2da44e; }
        .dirty { color: #cf222e; }

        .agent-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #2da44e;
            border-radius: 50%;
            margin-left: 8px;
            vertical-align: middle;
            cursor: default;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(45, 164, 78, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(45, 164, 78, 0); }
            100% { box-shadow: 0 0 0 0 rgba(45, 164, 78, 0); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Birdseye</h1>
        <div class="nav">
            <a href="/recent">Recent</a>
            <a href="/search">Search</a>
        </div>
    </div>

    <div class="search-box">
        <form action="/search" method="GET">
            <input type="search" name="q" placeholder="Search all thoughts...">
        </form>
    </div>

    <h2>Projects ({{len .Projects}})</h2>
    <div class="projects">
        {{range .Projects}}
        <div class="project" data-path="{{.Name}}/thoughts">
            <div class="project-header">
                <div class="project-name"><a href="/project/{{.Name}}">{{.Name}}</a>{{if index $.Agents .Name}}<span class="agent-dot" title="{{index $.Agents .Name}}"></span>{{end}}</div>
                <button class="copy-btn" onclick="copyProjectPath(this, event)">Copy</button>
            </div>
            {{if .Git}}<div class="project-meta"><span class="branch">{{.Git.Branch}}{{if .Git.Dirty}}<span class="dirty">*</span>{{end}}</span></div>{{end}}
            {{if .Summary}}<div class="project-summary">{{.Summary}}</div>{{end}}
        </div>
        {{end}}
    </div>

    <script>
        function copyProjectPath(btn, event) {
            event.preventDefault();
            event.stopPropagation();
            const el = btn.closest('[data-path]');
            const path = '@' + el.dataset.path;
            navigator.clipboard.writeText(path);

            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.textContent = 'Copy';
                btn.classList.remove('copied');
            }, 1500);
        }

        // Live updates via SSE
        const events = new EventSource('/events');

        events.addEventListener('change', function(e) {
            const data = JSON.parse(e.data);
            if (data.type === 'projects' || data.type === 'files') {
                refreshProjects();
            }
        });

        events.addEventListener('error', function(e) {
            console.log('SSE connection lost, will reconnect...');
        });

        async function refreshProjects() {
            try {
                const response = await fetch('/api/projects');
                const projects = await response.json();
                const container = document.querySelector('.projects');
                container.innerHTML = projects.map(p => `
                    <div class="project" data-path="${p.name}/thoughts">
                        <div class="project-header">
                            <div class="project-name"><a href="/project/${p.name}">${p.name}</a>${p.agentCount ? `<span class="agent-dot" title="${p.agentCount === 1 ? (p.agentPrompts[0] || 'Agent active').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;') : p.agentCount + ' agents active'}"></span>` : ''}</div>
                            <button class="copy-btn" onclick="copyProjectPath(this, event)">Copy</button>
                        </div>
                        ${p.branch ? `<div class="project-meta"><span class="branch">${p.branch}${p.dirty ? '<span class="dirty">*</span>' : ''}</span></div>` : ''}
                        ${p.summary ? `<div class="project-summary">${p.summary}</div>` : ''}
                    </div>
                `).join('');
                // Update count
                document.querySelector('h2').textContent = `Projects (${projects.length})`;
            } catch (err) {
                console.error('Failed to refresh projects:', err);
            }
        }
        // Poll agent status every 5 seconds (lightweight update, no DOM rebuild)
        async function refreshAgentStatus() {
            try {
                const response = await fetch('/api/projects');
                const projects = await response.json();
                const agentMap = {};
                projects.forEach(p => {
                    if (p.agentCount) {
                        agentMap[p.name] = p.agentCount === 1
                            ? (p.agentPrompts[0] || 'Agent active')
                            : p.agentCount + ' agents active';
                    }
                });

                document.querySelectorAll('.project').forEach(el => {
                    const link = el.querySelector('.project-name a');
                    if (!link) return;
                    const name = link.textContent;
                    const existingDot = el.querySelector('.agent-dot');
                    if (agentMap[name]) {
                        if (!existingDot) {
                            const dot = document.createElement('span');
                            dot.className = 'agent-dot';
                            dot.title = agentMap[name];
                            el.querySelector('.project-name').appendChild(dot);
                        } else {
                            existingDot.title = agentMap[name];
                        }
                    } else if (existingDot) {
                        existingDot.remove();
                    }
                });
            } catch (err) {}
        }
        refreshAgentStatus();
        setInterval(refreshAgentStatus, 30000);
    </script>
</body>
</html>
