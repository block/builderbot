<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birdseye</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px;
            background: #fafafa;
            color: #333;
        }
        h1 { color: #333; margin: 0 0 8px 0; font-size: 1.5em; font-weight: 600; }
        h2 { color: #555; margin: 24px 0 16px 0; font-size: 1em; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e0e0e0;
        }
        .nav a {
            margin-left: 20px;
            color: #666;
        }
        .nav a:hover { color: #0066cc; }

        .search-box {
            margin-bottom: 32px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px;
            font-size: 1em;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            color: #333;
        }
        .search-box input:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }
        .search-box input::placeholder { color: #999; }

        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }
        .project {
            background: #fff;
            border-radius: 8px;
            padding: 16px 20px;
            border: 1px solid #e8e8e8;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .project:hover {
            border-color: #ccc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .project-name {
            font-weight: 600;
            font-size: 1.05em;
            margin-bottom: 4px;
        }
        .project-meta {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 8px;
        }
        .project-summary {
            font-size: 0.9em;
            color: #666;
            line-height: 1.5;
        }
        .branch { color: #2da44e; }
        .dirty { color: #cf222e; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Birdseye</h1>
        <div class="nav">
            <a href="/recent">Recent</a>
            <a href="/search">Search</a>
        </div>
    </div>

    <div class="search-box">
        <form action="/search" method="GET">
            <input type="search" name="q" placeholder="Search all thoughts...">
        </form>
    </div>

    <h2>Projects ({{len .Projects}})</h2>
    <div class="projects">
        {{range .Projects}}
        <div class="project">
            <div class="project-name"><a href="/project/{{.Name}}">{{.Name}}</a></div>
            {{if .Git}}<div class="project-meta"><span class="branch">{{.Git.Branch}}{{if .Git.Dirty}}<span class="dirty">*</span>{{end}}</span></div>{{end}}
            {{if .Summary}}<div class="project-summary">{{.Summary}}</div>{{end}}
        </div>
        {{end}}
    </div>
</body>
</html>
