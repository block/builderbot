<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent Files - Birdseye</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        a { color: #00d4ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .breadcrumb { margin-bottom: 20px; color: #888; font-size: 0.9em; }
        .breadcrumb a { color: #888; }
        .breadcrumb a:hover { color: #00d4ff; }
        h1 { color: #00d4ff; }
        .file {
            padding: 12px 16px;
            background: #16213e;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #0f3460;
            transition: border-color 0.2s;
        }
        .file:hover { border-color: #00d4ff; }
        .file-info { min-width: 0; }
        .file-name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-project { color: #888; font-size: 0.85em; }
        .file-time {
            color: #888;
            font-size: 0.85em;
            white-space: nowrap;
            margin-left: 16px;
        }
    </style>
</head>
<body>
    <div class="breadcrumb">
        <a href="/">← All Projects</a> / Recent Files
    </div>

    <h1>Recent Files</h1>
    <p style="color: #888; margin-bottom: 20px;">50 most recently modified files</p>

    {{range .Files}}
    <div class="file">
        <div class="file-info">
            <div class="file-name"><a href="/file/{{.Project}}/{{.FilePath}}">{{.FileName}}</a></div>
            <div class="file-project">{{.Project}}/{{.FilePath}}</div>
        </div>
        <span class="file-time">{{.ModTime.Format "Jan 2, 2006 3:04 PM"}}</span>
    </div>
    {{end}}
</body>
</html>
