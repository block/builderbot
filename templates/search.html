<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Birdseye</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
            background: #fafafa;
            color: #333;
        }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .breadcrumb { margin-bottom: 20px; color: #888; font-size: 0.9em; }
        .breadcrumb a { color: #666; }
        .breadcrumb a:hover { color: #0066cc; }
        h1 { color: #333; font-weight: 600; }
        input[type="search"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 1em;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            color: #333;
            margin-bottom: 20px;
        }
        input[type="search"]:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }
        input[type="search"]::placeholder { color: #999; }
        .stats { color: #888; margin-bottom: 16px; }
        .result {
            background: #fff;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 6px;
            border: 1px solid #e8e8e8;
        }
        .result:hover { border-color: #ccc; }
        .result-header { margin-bottom: 4px; }
        .result-file { font-weight: 500; }
        .result-line { color: #888; font-size: 0.85em; }
        .result-context {
            font-family: "SF Mono", Menlo, Monaco, monospace;
            font-size: 0.85em;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .no-results { color: #888; font-style: italic; }
    </style>
</head>
<body>
    <div class="breadcrumb">
        <a href="/">← All Projects</a> / Search
    </div>

    <h1>Search</h1>
    <form method="GET" action="/search">
        <input type="search" name="q" placeholder="Search all thoughts..." value="{{.Query}}" autofocus>
    </form>

    {{if .Results}}
    <p class="stats">{{len .Results}} results{{if ge (len .Results) 100}} (limited to 100){{end}}</p>
    {{range .Results}}
    <div class="result">
        <div class="result-header">
            <a class="result-file" href="/file/{{.Project}}/{{.FilePath}}">{{.Project}}/{{.FilePath}}</a>
            <span class="result-line">:{{.Line}}</span>
        </div>
        <div class="result-context">{{.Context}}</div>
    </div>
    {{end}}
    {{else if .Query}}
    <p class="no-results">No results found for "{{.Query}}"</p>
    {{end}}
</body>
</html>
