<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Birdseye</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        a { color: #00d4ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .breadcrumb { margin-bottom: 20px; color: #888; font-size: 0.9em; }
        .breadcrumb a { color: #888; }
        .breadcrumb a:hover { color: #00d4ff; }
        h1 { color: #00d4ff; }
        input[type="search"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 1.1em;
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 6px;
            color: #eee;
            margin-bottom: 20px;
        }
        input[type="search"]:focus {
            outline: none;
            border-color: #00d4ff;
        }
        input[type="search"]::placeholder {
            color: #666;
        }
        .stats { color: #888; margin-bottom: 16px; }
        .result {
            background: #16213e;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 6px;
            border: 1px solid #0f3460;
        }
        .result:hover {
            border-color: #00d4ff;
        }
        .result-header {
            margin-bottom: 4px;
        }
        .result-file { font-weight: 500; }
        .result-line { color: #888; font-size: 0.85em; }
        .result-context {
            font-family: "SF Mono", Menlo, Monaco, monospace;
            font-size: 0.85em;
            color: #ccc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .no-results { color: #888; font-style: italic; }
    </style>
</head>
<body>
    <div class="breadcrumb">
        <a href="/">← All Projects</a> / Search
    </div>

    <h1>Search</h1>
    <form method="GET" action="/search">
        <input type="search" name="q" placeholder="Search all thoughts..." value="{{.Query}}" autofocus>
    </form>

    {{if .Results}}
    <p class="stats">{{len .Results}} results{{if ge (len .Results) 100}} (limited to 100){{end}}</p>
    {{range .Results}}
    <div class="result">
        <div class="result-header">
            <a class="result-file" href="/file/{{.Project}}/{{.FilePath}}">{{.Project}}/{{.FilePath}}</a>
            <span class="result-line">:{{.Line}}</span>
        </div>
        <div class="result-context">{{.Context}}</div>
    </div>
    {{end}}
    {{else if .Query}}
    <p class="no-results">No results found for "{{.Query}}"</p>
    {{end}}
</body>
</html>
